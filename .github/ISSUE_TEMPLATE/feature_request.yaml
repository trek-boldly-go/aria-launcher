name: Feature request
description: Suggest a feature or improvement for ARIA.
title: "[FEATURE] "
labels: [feature-request, 'status: needs triage']
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Before submitting:
        1. Check the [Roadmap](https://github.com/trek-boldly-go/aria-launcher/blob/aria-dev/ROADMAP.md) to see if it's already planned.
        2. Search **both [open and closed issues](https://github.com/trek-boldly-go/aria-launcher/issues?q=is%3Aissue+sort%3Aupdated-desc+)** for existing requests.

        Keep in mind that ARIA's [non-goals](https://github.com/trek-boldly-go/aria-launcher/blob/aria-dev/ROADMAP.md#non-goals) include: replacing the app drawer, becoming a widget platform, and adding telemetry.

  - type: textarea
    id: feature-description
    attributes:
      label: Describe the feature
      description: A clear and concise description of what the feature is.
    validations:
      required: true

  - type: textarea
    id: feature-usefulness
    attributes:
      label: Why would it be useful?
      description: Explain the use case. What problem does this solve? What workflow does it improve?
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature area
      description: Which part of ARIA does this relate to?
      options:
        - "Home screen / Brief cards"
        - "Chat"
        - "Skills"
        - "Rules"
        - "LLM providers"
        - "Predictions / context signals"
        - "Settings / onboarding"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: feature-examples
    attributes:
      label: Examples
      description: Screenshots, mockups, links, or descriptions of similar features in other apps.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the feature here.
    validations:
      required: false

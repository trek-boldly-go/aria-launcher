name: Bug report
description: Create a report to help us address issues you are facing with ARIA.
title: "[BUG] "
labels: [bug, 'status: needs triage']
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this issue! Before submitting:
        1. Use the [**latest build**](https://github.com/trek-boldly-go/aria-launcher/releases) when reporting bugs.
        2. Search **both [open and closed issues](https://github.com/trek-boldly-go/aria-launcher/issues?q=is%3Aissue+sort%3Aupdated-desc+)** to check if your bug has already been reported.

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the bug. Be specific about what you did to encounter it.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

  - type: textarea
    id: device-info
    attributes:
      label: Device information
      description: Provide details about your device and OS.
      placeholder: |
        - Device: Google Pixel 9
        - OS: Android 16 (API 36)
    validations:
      required: true

  - type: dropdown
    id: llm-provider
    attributes:
      label: LLM provider
      description: Which LLM provider are you using? Select "None" if the bug is unrelated to AI features.
      options:
        - "None / not applicable"
        - "Gemini (Google AI Studio)"
        - "Claude (API key)"
        - "Claude (OAuth)"
        - "Ollama"
        - "OpenRouter"
        - "OpenAI-compatible"
        - "On-device (LiteRT)"
    validations:
      required: true

  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions granted
      description: Check which permissions you have granted to ARIA.
      options:
        - label: Location (for WiFi SSID)
        - label: Activity Recognition
        - label: Calendar
        - label: Usage Stats (via adb or Settings)
        - label: Notification Listener

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Add any other context about the problem here.

        If this is a crash or error, include relevant logcat output filtered by `ARIA.` tags.
      placeholder: |
        adb logcat -s ARIA.ChatModule ARIA.SkillExecutor ARIA.ContextSignals
    validations:
      required: false
